name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A crates.io version is permanent — it can be yanked but never replaced
      # — so a tag that disagrees with the manifest must not reach the upload.
      - name: compare tag to the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match workspace version $manifest"
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Only the library is published; `demo` stays a repo-local example.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop -c cargo publish -p dioxus-flow

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
