name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: nix develop -c cargo fmt --all --check

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: nix develop -c cargo test -p dioxus-flow

      - name: Check demo (wasm)
        run: nix develop -c cargo check -p demo --target wasm32-unknown-unknown
